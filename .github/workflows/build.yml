name: Build Van Gogh driver kexts

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Check out SteamDeckintosh
        uses: actions/checkout@v4

      - name: Fetch MacKernelSDK headers and kmod library
        run: git clone --depth 1 https://github.com/acidanthera/MacKernelSDK.git MacKernelSDK

      # The driver is OpenCore-injected from the boot kernel collection and
      # must not depend on IOGraphicsFamily. The framebuffer lives in the
      # auxiliary collection and may depend on it. Keep them in two bundles.
      - name: Build unsigned x86_64 Van Gogh driver kext
        run: xcodebuild -project SteamDeckintosh.xcodeproj -target SteamDeckintosh -configuration Debug -sdk macosx -arch x86_64 SYMROOT=build CODE_SIGNING_ALLOWED=NO build
      - name: Build unsigned x86_64 Van Gogh framebuffer kext
        run: xcodebuild -project SteamDeckintosh.xcodeproj -target SteamDeckintoshFB -configuration Debug -sdk macosx -arch x86_64 SYMROOT=build CODE_SIGNING_ALLOWED=NO build

      - name: Verify the IOGraphicsFamily dependency lives only in the FB kext
        run: |
          ! grep -q IOGraphicsFamily build/Debug/SteamDeckintosh.kext/Contents/Info.plist
          grep -q IOGraphicsFamily build/Debug/SteamDeckintoshFB.kext/Contents/Info.plist

      - name: Strip debug symbols
        run: |
          strip -S build/Debug/SteamDeckintosh.kext/Contents/MacOS/SteamDeckintosh
          strip -S build/Debug/SteamDeckintoshFB.kext/Contents/MacOS/SteamDeckintoshFB

      - name: Stage both kexts in one artifact
        run: |
          mkdir -p build/artifact
          cp -R build/Debug/SteamDeckintosh.kext build/artifact/
          cp -R build/Debug/SteamDeckintoshFB.kext build/artifact/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SteamDeckintosh-VanGogh-kexts
          path: build/artifact
