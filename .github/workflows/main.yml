name: linux-mesa-ios

on:
  push:
    branches: ["*"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: macos-15-intel
    permissions:
      contents: write
    defaults:
      run:
        working-directory: VanGoghGPU
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build dependencies
        run: sh tools/fetch_deps.sh

      - name: Host tests
        run: make hosttest

      - name: Check register offsets against Linux v6.12
        run: |
          sh tools/fetch_linux_ref.sh ../linux-vg-ref
          python3 tools/check_regs.py

      - name: Build kexts
        run: make probe fb

      - name: Verify bundles
        run: |
          test -f build/out/VanGoghProbe.kext/Contents/MacOS/VanGoghProbe
          test -f build/out/VGAMDFramebuffer.kext/Contents/MacOS/VGAMDFramebuffer
          find build/out -name '*.kext' -maxdepth 2 -print

      - name: Package
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            build/out/VanGoghProbe.kext artifacts/VanGoghProbe.kext.zip
          ditto -c -k --sequesterRsrc --keepParent \
            build/out/VGAMDFramebuffer.kext artifacts/VGAMDFramebuffer.kext.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VanGoghGPU
          path: VanGoghGPU/artifacts/*.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" artifacts/*.zip \
            -t "${{ github.ref_name }}" --generate-notes
